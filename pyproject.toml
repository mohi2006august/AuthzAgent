[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-authz"
version = "0.1.0"
description = "Capability-based tool-call authorisation for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
eval = ["matplotlib>=3.7"]
agents = ["anthropic", "langgraph"]
dev = ["pytest>=8"]

[project.scripts]
authz-bench = "authz_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
